<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Библиотека — список книг</title>
</head>
<body>
<h1>Список книг читателя</h1>

<form action="BooksList" method="get" accept-charset="UTF-8">
    <p>
        <label for="name">Имя читателя:</label>
        <input
                type="text"
                id="name"
                name="name"
                placeholder="Например, Иван"
        >
    </p>

    <p>
        <label for="status">Какие книги показать:</label>

        <select id="status" name="status">
            <option value="all">Все книги</option>
            <option value="read">Прочитанные</option>
            <option value="unread">Непрочитанные</option>
        </select>
    </p>

    <button type="submit">Показать книги — GET</button>

    <button type="submit" formmethod="post">
        Показать книги — POST
    </button>
</form>
</body>
</html>
